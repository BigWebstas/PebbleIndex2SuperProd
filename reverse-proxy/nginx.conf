# Reverse proxy for Index2SP's Pebble webhook listener (nginx).
#
# Use this instead of a tunnel (cloudflared/ngrok) when you already have a
# public-facing box running nginx. Replace pebble.example.com and the two
# ssl_certificate paths with your own (e.g. from certbot), then drop this in
# sites-available/ and symlink it into sites-enabled/.
#
# Assumes Index2SP is running on this same machine with its defaults
# (listenAddress 127.0.0.1, port 8787) — adjust proxy_pass if you changed
# either in config.json.

server {
    listen 80;
    server_name pebble.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pebble.example.com;

    ssl_certificate     /etc/letsencrypt/live/pebble.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pebble.example.com/privkey.pem;

    # Pebble's audio uploads can be up to ~30 MB (Index2SP's own Kestrel
    # limit) — nginx's default (1 MB) would reject them before they ever
    # reach Index2SP.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # Preserve everything Index2SP checks or logs: the Authorization
        # header (inboundAuthToken), the real client IP, and the original
        # scheme/host.
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI classification (Claude/Gemini/OpenAI/Ollama) can add a few
        # seconds before Index2SP replies.
        proxy_read_timeout 30s;
    }
}
